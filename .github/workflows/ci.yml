name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest --cov=urban_heat_risk --cov-report=term-missing
      - name: Build deterministic demo artifacts
        run: python scripts/bootstrap_demo.py
      - name: Import-check Streamlit pages
        run: python -m compileall app src scripts
