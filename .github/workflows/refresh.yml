name: Refresh heat-risk forecast

on:
  schedule:
    # 10:00 AM Berlin summer time
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify required files
        run: |
          test -f artifacts/anomaly_models.joblib
          test -f data/reference/district_profiles.csv
          test -f configs/settings.json

      - name: Refresh forecast
        run: python scripts/refresh_forecast.py --mode live

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/forecast_daily.csv \
            data/processed/latest_risk.csv \
            data/processed/data_health.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh daily heat-risk forecast"
            git pull --rebase
            git push
          fi