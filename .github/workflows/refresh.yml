name: Refresh live forecast

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Refresh forecast and scores
        run: python scripts/refresh_forecast.py --mode live
      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/latest_risk.csv data/processed/forecast_daily.csv data/processed/data_health.json
          git diff --cached --quiet || git commit -m "chore(data): refresh heat-risk forecast"
          git push
