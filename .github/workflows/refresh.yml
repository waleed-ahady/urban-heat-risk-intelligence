name: Refresh heat-risk forecast

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check

      - name: Refresh forecast
        shell: bash
        run: |
          set -euxo pipefail

          python --version
          pwd

          ls -lh artifacts/anomaly_models.joblib
          ls -lh data/reference/district_profiles.csv
          ls -lh configs/settings.json

          python -u scripts/refresh_forecast.py --mode live

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          find data/processed -maxdepth 1 -type f -print || true
          ls -lh data/processed || true

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/forecast_daily.csv \
            data/processed/latest_risk.csv \
            data/processed/data_health.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh daily heat-risk forecast"
            git pull --rebase
            git push
          fi
