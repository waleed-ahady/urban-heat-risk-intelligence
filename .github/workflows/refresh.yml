name: Refresh heat-risk forecast

on:
  schedule:
    # Every day at 05:15 UTC
    # 07:15 Berlin summer time / 06:15 Berlin winter time
    - cron: "15 5 * * *"

  # Allows manual execution from the GitHub Actions page
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Refresh live forecast
        run: |
          python scripts/refresh_forecast.py --mode live

      - name: Commit updated forecast files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/forecast_daily.csv \
            data/processed/latest_risk.csv \
            data/processed/data_health.json

          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "chore: refresh daily heat-risk forecast"
            git push
          fi