[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-heat-risk-intelligence"
version = "0.1.0"
description = "End-to-end urban heat risk intelligence platform for Berlin districts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Portfolio Project"}]
dependencies = [
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
